# kind cluster config for the "AI on Kubernetes — Security" demos.
#
# We DISABLE the default CNI (kindnet) so we can install Calico, which
# *enforces* NetworkPolicy. This is the whole point of Demo 2: without a
# policy-enforcing CNI the "default-deny egress" punchline does not fire.
#
# Fully local, single node, CPU-only. No GPU required.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ai-sec
networking:
  disableDefaultCNI: true      # we bring our own CNI (Calico)
  podSubnet: "192.168.0.0/16"  # Calico's default expected pod CIDR
nodes:
  - role: control-plane
    # Expose the agent NodePort so you can poke it from your laptop during the talk.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
